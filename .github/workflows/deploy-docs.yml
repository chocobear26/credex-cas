name: Build and deploy docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Hugo fetches the Docsy theme as a Hugo module, which needs Go.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      # Docsy's stylesheets compile with Dart Sass, a project-local npm dependency.
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      # The documentation checks and the instruction generator.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.166.0'
          extended: true

      # Checks, renders every PlantUML diagram through Kroki, builds site/, and assembles deploy/.
      # No Java, PlantUML or Graphviz: see layouts/_markup/render-image.html.
      - name: Build
        run: make stage

      # deploy/ holds exactly what GitHub Pages serves: index.html at the top, the docs under site/,
      # at https://chocobear26.github.io/credex-cas/site/.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./deploy/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
